<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="وب‌سایت شخصی طاها مهدی‌نژاد">
    <title>Taha Mahdinezhad | Official Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #050914;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            background: #0066ff;
            filter: blur(150px);
            opacity: 0.25;
            top: 10%;
            right: -100px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            background: #00c8ff;
            filter: blur(160px);
            opacity: 0.15;
            bottom: 0;
            left: -100px;
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid #ffffff12;
        }

        .logo {
            color: #38bdf8;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 1px;
            direction: ltr;
        }

        .status {
            color: #9caec9;
            font-size: 12px;
        }

        main {
            position: relative;
            z-index: 1;
            min-height: 78vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 70px 20px;
        }

        .content {
            max-width: 700px;
            animation: appear 1s ease;
        }

        .badge {
            display: inline-block;
            border: 1px solid #38bdf855;
            background: #38bdf80c;
            color: #38bdf8;
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 12px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(34px, 8vw, 65px);
            line-height: 1.5;
            margin-bottom: 12px;
            direction: ltr;
        }

        h1 span {
            color: #38bdf8;
            text-shadow: 0 0 35px #0284c755;
        }

        .subtitle {
            font-size: 17px;
            color: #a5b4cc;
            margin-bottom: 22px;
        }

        .description {
            max-width: 500px;
            margin: 0 auto 32px;
            line-height: 2.2;
            font-size: 14px;
            color: #8292ad;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
            transition: 0.3s;
        }

        .primary {
            background: #168cff;
            color: white;
            box-shadow: 0 0 25px #168cff35;
        }

        .primary:hover {
            background: #38bdf8;
            transform: translateY(-3px);
        }

        .secondary {
            border: 1px solid #ffffff25;
            color: #d8e5fa;
        }

        .secondary:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .line {
            width: 70px;
            height: 3px;
            background: #38bdf8;
            border-radius: 5px;
            margin: 30px auto;
            box-shadow: 0 0 15px #38bdf8;
        }

        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 25px 15px;
            border-top: 1px solid #ffffff12;
            color: #64748b;
            font-size: 12px;
            direction: ltr;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 20px 5%;
            }

            .logo {
                font-size: 15px;
            }

            .subtitle {
                font-size: 15px;
            }

            .description {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">TAHA.M</div>
        <div class="status">PERSONAL WEBSITE</div>
    </header>

    <main>
        <section class="content">

            <div class="badge">WELCOME TO MY WORLD</div>

            <h1>
                TAHA<br>
                <span>MAHDINEZHAD</span>
            </h1>

            <div class="line"></div>

            <p class="subtitle">به دنیای شخصی من خوش اومدی!</p>

            <p class="description">
                من طاها مهدی‌نژاد هستم.
                اینجا فضای شخصی منه؛ جایی برای معرفی من،
                علایقم و مسیرهایی که برای آینده‌ام انتخاب می‌کنم.
                خوشحالم که اینجایی.
            </p>

            <div class="buttons">
                <a class="btn primary"
                   href="https://instagram.com/Tahamahdinezhad"
                   target="_blank"
                   rel="noopener noreferrer">
                    Instagram ↗
                </a>

                <a class="btn secondary" href="#about">
                    درباره من
                </a>
            </div>

        </section>
    </main>

    <footer id="about">
        © 2026 TAHA MAHDINEZHAD — ALL RIGHTS RESERVED
    </footer>

</body>
</html>
